<!DOCTYPE html>
<html>
<head>
<meta name="keyword" content="calculator">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="John Doe">
<meta charset="UTF-8">
<title>Calculator</title>
<link rel="stylesheet" href="index.css">
</head>
<body>

<div class="calc">
<input type="text" readonly>
<div class="btns">
<button data-append-number="1">1</button>
<button data-append-number="2">2</button>
<button data-append-number="3">3</button>
<button data-operation="+">+</button>
<button data-append-number="4">4</button>
<button data-append-number="5">5</button>
<button data-append-number="6">6</button>
<button data-operation="-">-</button>
<button data-append-number="7">7</button>
<button data-append-number="8">8</button>
<button data-append-number="9">9</button>
<button data-operation="*">*</button>
<button data-operation="/">/</button>
<button data-operation="%">%</button>
<button data-calculate="=">=</button>
<button data-clear="C">C</button>
</div>
</div>



<script src="index.js"></script>
</body>
</html>
